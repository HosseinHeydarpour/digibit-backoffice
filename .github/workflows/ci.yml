name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Lint, typecheck, unit, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npx tsc -p tsconfig.app.json --noEmit
      - run: npm test
      - run: npm run build

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      # The panel is no longer mock-backed; e2e talks to the real API.
      - uses: actions/checkout@v4
        with:
          repository: HosseinHeydarpour/digibit-backend
          path: backend

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # The API runs in the SAME step as the suite: a background process from
      # an earlier step is not guaranteed to survive into the next one.
      - name: Run e2e against the real API
        run: |
          cd backend/src/Digibit.Api
          ASPNETCORE_ENVIRONMENT=Development \
          Database__Provider=sqlite \
          ConnectionStrings__Default="Data Source=$RUNNER_TEMP/digibit-e2e.db" \
          dotnet run --urls http://localhost:5072 &
          cd "$GITHUB_WORKSPACE"
          for i in $(seq 1 60); do
            if curl -fs http://localhost:5072/health/live >/dev/null; then
              echo "API is up"
              break
            fi
            sleep 2
          done
          curl -fs http://localhost:5072/health/live >/dev/null || exit 1
          npm run e2e
        env:
          CI: 'true'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

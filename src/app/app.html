<!--
  The root shell: every page renders through the outlet.

  `<app-confirm-dialog>` sits OUTSIDE the outlet on purpose. A confirmation can
  be open while the user navigates (a list page asks "delete this?", the answer
  arrives after a route change), so the dialog must live somewhere that is never
  destroyed. Anything mounted inside a routed page or the layout would be torn
  down mid-flight, taking its pending Promise with it. BO-B11.
-->
<router-outlet />
<app-confirm-dialog />

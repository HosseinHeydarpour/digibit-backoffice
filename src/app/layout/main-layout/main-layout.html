<div class="flex h-screen overflow-hidden bg-light dark:bg-background-dark">
  <!--
    The desktop sidebar's width lives here, on the aside, not on the sidebar
    itself. The sidebar is reused inside the mobile drawer, where it must fill
    the panel instead — a `w-72` on the component left a gap whenever the
    `w-[80%] sm:w-100` panel was wider than 288px. `shrink-0` keeps the 288px
    from collapsing under the main content's `flex-1`.
  -->
  <aside class="hidden w-72 shrink-0 lg:flex">
    <app-sidebar />
  </aside>

  <div class="flex flex-col flex-1 overflow-hidden">
    <!--
      `menuToggle` is the only link between the topbar and the drawer: the
      topbar announces "the user wants the menu", and this shell decides that
      means "open the drawer". Neither component knows about the other.
    -->
    <app-topbar (menuToggle)="openDrawer()" />

    <main class="flex-1 overflow-y-auto p-6">
      <router-outlet />

      <!--
        ====================================================================
        TEMPORARY — a visual sample of <app-empty-state> (BO-B13)
        ====================================================================

        Delete this whole block with the <app-empty-state> import when real
        pages land. It exists for one reason only: every feature route in
        `app.routes.ts` is still COMPONENT-LESS, so the routed area renders
        nothing and there is nowhere to see the component yet. Mounting it here,
        inside <main>, puts it on screen for every URL.

        The four blocks below are the four states the component can be in,
        which is the whole of its API:

          1. an empty list with a way out     (tc 5 — action button)
          2. a search that found nothing      (tc 6 — different sentence, no button)
          3. a title-only state               (tc 1 — no description paragraph)
          4. the bare default                 (tc 3 — nothing configured at all)

        Each one is wrapped in its own card, because the component deliberately
        paints no surface of its own (see its template header) — the caller owns
        the box. That is exactly what this demonstrates.

        The grid collapses to one column under `xl`, which is also where you can
        check tc 7 (the centred column needs no breakpoint of its own).
      -->
      <section class="mt-6 border-t border-gray-200 pt-6 dark:border-gray-700">
        <p class="mb-4 text-xs text-gray-500 dark:text-gray-400">
          نمونهٔ موقت حالت خالی (BO-B13) — برای حذف پس از افزودن صفحات واقعی
        </p>

        <div class="grid grid-cols-1 gap-4 xl:grid-cols-2">
          <!-- 1. An empty list, with the action that fixes it (tc 5). -->
          <div
            class="rounded-xl border border-gray-200 bg-white dark:border-gray-700 dark:bg-gray-800"
          >
            <app-empty-state
              title="هنوز محصولی ثبت نشده"
              description="اولین کالای فروشگاه را اضافه کنید تا در این فهرست نمایش داده شود."
              actionLabel="افزودن محصول"
              (action)="onSampleAction()"
            />
          </div>

          <!-- 2. A search with no hits (tc 6). Same component, sharper glyph,
               and deliberately no button — there is nothing to create. -->
          <div
            class="rounded-xl border border-gray-200 bg-white dark:border-gray-700 dark:bg-gray-800"
          >
            <app-empty-state icon="pi pi-search" title="نتیجه‌ای یافت نشد" />
          </div>

          <!-- 3. Title only (tc 1): no description paragraph is rendered at all,
               so there is no leftover margin where it would have been. -->
          <div
            class="rounded-xl border border-gray-200 bg-white dark:border-gray-700 dark:bg-gray-800"
          >
            <app-empty-state title="سفارشی برای امروز ثبت نشده" />
          </div>

          <!-- 4. The bare default (tc 3): every input omitted, so the component
               speaks its own Persian defaults. -->
          <div
            class="rounded-xl border border-gray-200 bg-white dark:border-gray-700 dark:bg-gray-800"
          >
            <app-empty-state />
          </div>
        </div>
      </section>
    </main>
  </div>

  <!--
    Outside the shell, not inside the flex column: the drawer is `fixed`, and
    keeping it a sibling of the `overflow-hidden` root avoids any chance of the
    slide-in being clipped during the transition.
  -->
  <app-sidebar-drawer />
</div>

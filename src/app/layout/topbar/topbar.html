<!-- src/app/layout/topbar/topbar.html -->
<!--
  Scenarios:
  - Desktop (>=992px): the sidebar is permanently visible in the shell's
    <aside>, so this hamburger is hidden and the topbar renders title only.
  - Mobile (<992px): the sidebar is hidden and this is the sole way to open
    navigation; tapping it emits `menuToggle` for the parent drawer to handle.
  - Route change while the topbar is mounted: <h1> re-reads `title()`, which
    is a signal, so the heading updates without re-creating the component.
-->
<header
  class="flex h-20 shrink-0 items-center gap-3 border-b border-gray-200 bg-white px-4 sm:px-6 dark:border-gray-700 dark:bg-card-dark"
>
  <!--
    Hamburger: mobile only. `lg:hidden` hides it at >=992px, matching the
    `hidden lg:flex` gate on the sidebar's <aside> so exactly one of the two
    affordances is available at any width (test case 3). The 992px value comes
    from `--breakpoint-lg` in src/styles/tailwind.css, not Tailwind's default
    1024px — using the default would leave 992-1023px with neither control.

    `max-sm:h-11 max-sm:w-11` raises the box from 40px to 44px on phones, which
    is the smallest target a thumb hits reliably (BO-B17 tc 6). It is scoped to
    `max-sm` rather than applied everywhere: 44px of chrome in a desktop toolbar
    is a bigger button, not a better one, and it would undo the reference's
    density.
  -->
  <button
    type="button"
    (click)="menuToggle.emit()"
    aria-label="باز کردن منو"
    class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg text-gray-600 transition-colors hover:bg-gray-100 max-sm:h-11 max-sm:w-11 lg:hidden dark:text-gray-300 dark:hover:bg-gray-700"
  >
    <i class="pi pi-bars text-lg" aria-hidden="true"></i>
  </button>

  <!--
    `min-w-0` + `truncate` are the overflow fix (BO-B17 tc 7). A flex item
    defaults to `min-width: auto`, which refuses to shrink below its content, so
    a long route title pushed the theme switch past the viewport edge instead of
    ellipsising. `min-w-0` lets this item shrink and `truncate` (which includes
    `nowrap`) keeps the header's fixed `h-20` intact.

    `flex-1` reproduces the reference's `justify-between`: the title block and
    the switch are two groups with the gap between them, so the switch sits at
    the inline-end edge instead of hugging the title. The reference has a search
    box in that gap; this shell does not have one yet.
  -->
  <h1 class="min-w-0 flex-1 truncate text-lg font-semibold text-dark dark:text-light">
    {{ title() }}
  </h1>

  <!--
    Theme switch (BO-B07). Button classes and both inline SVGs are copied
    verbatim from the Arino reference's `#dark-mode-toggle`.

    The SVGs are deliberate rather than PrimeIcons: PrimeIcons'
    `.pi{display:inline-block}` is *unlayered* CSS, and unlayered rules beat
    Tailwind's `@layer utilities` regardless of specificity — so `.hidden` and
    `.dark:hidden` never applied to a `.pi` element and BOTH icons rendered at
    once (the reported bug). Verified in the built stylesheet: `.pi` sits
    outside every `@layer` block.
  -->
  <button
    type="button"
    (click)="theme.toggle()"
    [attr.aria-label]="theme.isDark() ? 'تغییر به حالت روشن' : 'تغییر به حالت تاریک'"
    class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg text-gray-500 transition-colors hover:bg-gray-100 hover:text-gray-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary max-sm:h-11 max-sm:w-11 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-gray-300"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="h-6 w-6 hidden dark:block"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      aria-hidden="true"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"
      />
    </svg>
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="h-6 w-6 dark:hidden"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      aria-hidden="true"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
      />
    </svg>
  </button>

  <!--
    THE PROFILE TRIGGER (BO-B06)

    `@if (session.user(); as account)` — the whole affordance is hidden when
    nobody is signed in, because an anonymous shell has no profile to show and
    «خروج» would be a lie. The token's default is `null`, so the trigger is
    absent by default rather than half-rendered.

    Label in Name (WCAG 2.5.3): the visible name must be *inside* the accessible
    name, or a speech user hears "منوی کاربر" and cannot tell which account they
    are about to sign out of. Hence the compound `aria-label` rather than a
    fixed one.
  -->
  @if (session.user(); as account) {
    <button
      type="button"
      (click)="toggleProfile(profileMenu, $event)"
      [attr.aria-label]="account.fullName + ' — منوی کاربر'"
      aria-haspopup="true"
      class="flex h-10 shrink-0 items-center gap-2 rounded-lg px-2 text-gray-600 transition-colors hover:bg-gray-100 max-sm:h-11 dark:text-gray-300 dark:hover:bg-gray-700"
    >
      <!--
        The avatar when the user has one (tc 9); otherwise initials. Reference
        shape: `h-8 w-8 rounded-full` with a ring and an online dot. The dot is
        dropped — presence is not something this panel knows about.
      -->
      @if (account.avatarUrl) {
        <img
          [src]="account.avatarUrl"
          [alt]="account.fullName"
          class="h-8 w-8 shrink-0 rounded-full border-2 border-white shadow dark:border-gray-800"
        />
      } @else {
        <span
          class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-primary/10 text-sm font-bold text-primary dark:bg-primary/20"
          aria-hidden="true"
          >{{ session.initials() }}</span
        >
      }

      <!-- `max-sm:hidden` keeps the row within 320px: avatar only, which is what
           the reference's own `max-sm:hidden` does to its avatar image. The
           chevron goes with the name, so a phone gets a 40px round target and
           nothing else. -->
      <span class="max-sm:hidden text-sm font-medium text-gray-900 dark:text-white">{{
        account.fullName
      }}</span>
      <i class="pi pi-angle-down max-sm:hidden text-xs" aria-hidden="true"></i>
    </button>
  }
</header>

<!--
  The menu lives OUTSIDE the header, not beside the trigger.

  Two reasons. In popup mode `p-menu` renders nothing until it is shown
  (`@if (!popup || overlayVisible)`), so its host element is an empty inline box
  that would otherwise become a zero-width flex item inside the header. And with
  `[appendTo]="'body'"` the real overlay is moved to `<body>` on show, so its
  position in the DOM is irrelevant to where it appears — all that matters is
  that the header's flex container does not lay it out.

  `appendTo="body"` is also the fix for tc 8: a menu kept inside the header
  inherits its clipping context and gets cut off on a phone, which would leave
  the off-canvas items unreachable.
-->
<p-menu
  #profileMenu
  [popup]="true"
  [model]="menuItems"
  [appendTo]="'body'"
  ariaLabel="منوی کاربر"
/>

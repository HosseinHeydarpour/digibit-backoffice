<!-- src/app/layout/topbar/topbar.html -->
<!--
  Scenarios:
  - Desktop (>=992px): the sidebar is permanently visible in the shell's
    <aside>, so this hamburger is hidden and the topbar renders title only.
  - Mobile (<992px): the sidebar is hidden and this is the sole way to open
    navigation; tapping it emits `menuToggle` for the parent drawer to handle.
  - Route change while the topbar is mounted: <h1> re-reads `title()`, which
    is a signal, so the heading updates without re-creating the component.
-->
<header
  class="flex h-20 shrink-0 items-center gap-3 border-b border-gray-200 bg-white px-6 dark:border-gray-700 dark:bg-card-dark"
>
  <!--
    Hamburger: mobile only. `lg:hidden` hides it at >=992px, matching the
    `hidden lg:flex` gate on the sidebar's <aside> so exactly one of the two
    affordances is available at any width (test case 3). The 992px value comes
    from `--breakpoint-lg` in src/styles/tailwind.css, not Tailwind's default
    1024px — using the default would leave 992-1023px with neither control.
  -->
  <button
    type="button"
    (click)="menuToggle.emit()"
    aria-label="باز کردن منو"
    class="flex h-10 w-10 items-center justify-center rounded-lg text-gray-600 transition-colors hover:bg-gray-100 lg:hidden dark:text-gray-300 dark:hover:bg-gray-700"
  >
    <i class="pi pi-bars text-lg" aria-hidden="true"></i>
  </button>

  <h1 class="text-lg font-semibold text-dark dark:text-light">{{ title() }}</h1>

  <!--
    Theme switch (BO-B07). Button classes and both inline SVGs are copied
    verbatim from the Arino reference's `#dark-mode-toggle`.

    The SVGs are deliberate rather than PrimeIcons: PrimeIcons'
    `.pi{display:inline-block}` is *unlayered* CSS, and unlayered rules beat
    Tailwind's `@layer utilities` regardless of specificity — so `.hidden` and
    `.dark:hidden` never applied to a `.pi` element and BOTH icons rendered at
    once (the reported bug). Verified in the built stylesheet: `.pi` sits
    outside every `@layer` block.
  -->
  <button
    type="button"
    (click)="theme.toggle()"
    [attr.aria-label]="theme.isDark() ? 'تغییر به حالت روشن' : 'تغییر به حالت تاریک'"
    class="text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300 focus:outline-none"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="h-6 w-6 hidden dark:block"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      aria-hidden="true"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"
      />
    </svg>
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="h-6 w-6 dark:hidden"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      aria-hidden="true"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
      />
    </svg>
  </button>
</header>

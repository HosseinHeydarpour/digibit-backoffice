<div
  class="flex h-full w-72 flex-col border-e border-gray-200 bg-white shadow-sm dark:border-gray-700 dark:bg-card-dark"
>
  <!-- Logo -->
  <div
    class="flex h-20 shrink-0 items-center justify-center border-b border-gray-200 p-4 dark:border-gray-700"
  >
    <div class="flex items-center">
      <div class="flex h-10 w-10 items-center justify-center rounded-md bg-primary">
        <i class="pi pi-sparkles h-6 w-6 text-white"></i>
      </div>
      <h1 class="ms-3 text-xl font-bold text-dark dark:text-light">
        پنل <span class="text-primary">مدیریت</span>
      </h1>
    </div>
  </div>

  <!-- Menu -->
  <nav class="flex flex-1 flex-col gap-4 overflow-y-auto p-4">
    @for (group of menu(); track group.label) {
      <div>
        <p
          class="mb-2 px-4 text-xs font-semibold uppercase tracking-wide text-gray-400 dark:text-gray-500"
        >
          {{ group.label }}
        </p>
        <ul class="space-y-1">
          @for (item of group.items; track item.routerLink) {
            <li>
              <a
                [routerLink]="item.routerLink"
                routerLinkActive="bg-primary/10 text-primary dark:bg-primary/20"
                (click)="itemActivated.emit()"
                class="flex items-center rounded-lg px-4 py-3 text-sm font-medium text-gray-700 transition-colors hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-700"
              >
                <i [class]="item.icon + ' me-3 text-base'"></i>
                <span>{{ item.label }}</span>
              </a>
            </li>
          }
        </ul>
      </div>
    }
  </nav>
</div>

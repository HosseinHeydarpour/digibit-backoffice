<form [formGroup]="form" (ngSubmit)="save()" class="space-y-4">
  <app-form-field
    controlName="title"
    label="عنوان صفحه"
    inputId="page-title"
    hint="بین ۳ و ۸۰ کاراکتر"
    [error]="fieldError('title')"
  >
    <input pInputText id="page-title" formControlName="title" class="w-full" />
  </app-form-field>

  <app-form-field
    controlName="body"
    label="متن صفحه"
    inputId="page-body"
    hint="خط جدید حفظ می‌شود"
    [error]="fieldError('body')"
  >
    <textarea id="page-body" rows="8" pTextarea formControlName="body" class="w-full"></textarea>
  </app-form-field>

  <div
    class="rounded-lg border border-gray-200 bg-gray-50 p-4 dark:border-gray-700 dark:bg-gray-700/30"
  >
    <p class="mb-2 text-xs font-medium text-gray-500 dark:text-gray-400">پیش‌نمایش</p>
    <div class="min-h-16 whitespace-pre-wrap text-sm leading-7 text-gray-800 dark:text-gray-200">
      {{ preview() }}
    </div>
  </div>

  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
    <app-form-field
      controlName="metaTitle"
      label="عنوان متا"
      inputId="page-meta-title"
      [hint]="metaTitleCount() + ' از ۷۰ کاراکتر'"
      [error]="fieldError('metaTitle')"
    >
      <input pInputText id="page-meta-title" formControlName="metaTitle" class="w-full" />
    </app-form-field>

    <app-form-field
      controlName="metaDescription"
      label="توضیحات متا"
      inputId="page-meta-description"
      [hint]="metaDescriptionCount() + ' از ۱۶۰ کاراکتر'"
      [error]="fieldError('metaDescription')"
    >
      <textarea
        id="page-meta-description"
        rows="3"
        pTextarea
        formControlName="metaDescription"
        class="w-full"
      ></textarea>
    </app-form-field>
  </div>

  @if (saveError(); as message) {
    <p
      role="alert"
      class="rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700 dark:border-red-900/40 dark:bg-red-900/20 dark:text-red-300"
    >
      {{ message }}
    </p>
  }

  <div
    class="flex flex-col-reverse gap-2 border-t border-gray-100 pt-4 sm:flex-row sm:justify-end dark:border-gray-700"
  >
    <button
      type="button"
      (click)="cancel()"
      [disabled]="saving()"
      class="inline-flex min-h-10 items-center justify-center rounded-lg border border-gray-300 px-4 text-sm font-medium text-gray-700 transition hover:bg-gray-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary disabled:cursor-not-allowed disabled:opacity-50 dark:border-gray-600 dark:text-gray-300 dark:hover:bg-gray-700"
    >
      انصراف
    </button>
    <button
      pButton
      type="submit"
      pLoading
      [loading]="saving()"
      class="inline-flex min-h-10 items-center justify-center"
    >
      ذخیره
    </button>
  </div>
</form>

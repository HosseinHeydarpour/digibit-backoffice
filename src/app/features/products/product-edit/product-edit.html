<app-page-header title="ویرایش محصول" description="اطلاعات کالای انتخابی را تغییر دهید">
  <button
    page-header-actions
    type="button"
    routerLink="/products"
    class="inline-flex items-center gap-2 rounded-lg border border-gray-300 px-4 py-2 text-sm font-medium text-gray-700 transition hover:bg-gray-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary dark:border-gray-600 dark:text-gray-200 dark:hover:bg-gray-700"
  >
    بازگشت
  </button>
</app-page-header>

<div
  class="overflow-hidden rounded-xl border border-gray-200 bg-white shadow-md dark:border-gray-700 dark:bg-gray-800"
>
  <div class="p-6">
    <p class="text-sm text-gray-500 dark:text-gray-400">
      <span>فرم ویرایش محصول</span>
      @if (productId(); as id) {
        <span>
          «<span class="font-mono">{{ id }}</span
          >»
        </span>
      }
      <span>در تسک</span> <span class="font-mono">BO-F07</span> <span>ساخته می‌شود.</span>
    </p>
  </div>
</div>

<div
  class="rounded-xl border border-gray-200 bg-white p-6 shadow-md dark:border-gray-700 dark:bg-gray-800"
>
  <div class="mb-4 flex flex-wrap items-center justify-between gap-4">
    <div>
      <h3 class="text-base font-bold text-gray-900 dark:text-white">آمار فروش</h3>
      <p class="text-xs text-gray-500 dark:text-gray-400">نمودار فروش دوره‌ای فروشگاه</p>
    </div>

    <div class="flex items-center gap-1 rounded-lg bg-gray-100 p-1 dark:bg-gray-700/50">
      <button
        type="button"
        [class]="
          range() === 7
            ? 'bg-white shadow text-primary font-bold dark:bg-gray-800'
            : 'text-gray-600 hover:text-gray-900 dark:text-gray-300 dark:hover:text-white'
        "
        class="rounded-md px-3 py-1.5 text-xs font-medium transition focus:outline-none"
        (click)="selectRange(7)"
      >
        ۷ روز اخیر
      </button>
      <button
        type="button"
        [class]="
          range() === 30
            ? 'bg-white shadow text-primary font-bold dark:bg-gray-800'
            : 'text-gray-600 hover:text-gray-900 dark:text-gray-300 dark:hover:text-white'
        "
        class="rounded-md px-3 py-1.5 text-xs font-medium transition focus:outline-none"
        (click)="selectRange(30)"
      >
        ۳۰ روز اخیر
      </button>
    </div>
  </div>

  @if (loading()) {
    <div class="flex h-72 w-full items-center justify-center">
      <i class="pi pi-spin pi-spinner text-2xl text-primary" aria-label="بارگذاری"></i>
    </div>
  } @else if (!hasData()) {
    <div
      class="flex h-72 w-full items-center justify-center text-sm text-gray-500 dark:text-gray-400"
    >
      داده‌ای نیست
    </div>
  } @else {
    <div class="relative h-72 w-full sm:h-80">
      <p-chart
        type="bar"
        [data]="chartData()"
        [options]="chartOptions()"
        class="block h-full w-full"
      />
    </div>
  }
</div>

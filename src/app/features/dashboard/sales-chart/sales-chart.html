<!-- src/app/features/dashboard/sales-chart/sales-chart.html -->
<!--
  THE CARD FILLS ITS ROW

  On `xl` this card sits in a 3-column grid beside «کالاهای کم‌موجودی», and the
  two used to end at different heights: the chart was a fixed `h-72`/`h-80`
  while the stock list grew with its rows. `h-full` + `flex flex-col` lets the
  card take the row height the grid hands it, and `flex-1` on the plot area
  gives the extra space to the CHART rather than to a blank strip under it —
  a taller chart is more readable, a taller card is not.

  `min-h-72` is the floor, not the height: on a phone the row is single-column
  and there is no sibling to stretch against, so the card keeps the 288px the
  chart needs to be legible.
-->
<div
  class="flex h-full flex-col rounded-xl border border-gray-200 bg-white p-6 shadow-md dark:border-gray-700 dark:bg-gray-800"
>
  <div class="mb-4 flex flex-wrap items-center justify-between gap-4">
    <div>
      <h3 class="text-base font-bold text-gray-900 dark:text-white">آمار فروش</h3>
      <p class="text-xs text-gray-500 dark:text-gray-400">درآمد و تعداد سفارشات هر روز</p>
    </div>

    <div class="flex items-center gap-1 rounded-lg bg-gray-100 p-1 dark:bg-gray-700/50">
      <button
        type="button"
        [class]="
          range() === 7
            ? 'bg-white shadow text-primary font-bold dark:bg-gray-800'
            : 'text-gray-600 hover:text-gray-900 dark:text-gray-300 dark:hover:text-white'
        "
        class="rounded-md px-3 py-1.5 text-xs font-medium transition focus:outline-none"
        (click)="selectRange(7)"
      >
        ۷ روز اخیر
      </button>
      <button
        type="button"
        [class]="
          range() === 30
            ? 'bg-white shadow text-primary font-bold dark:bg-gray-800'
            : 'text-gray-600 hover:text-gray-900 dark:text-gray-300 dark:hover:text-white'
        "
        class="rounded-md px-3 py-1.5 text-xs font-medium transition focus:outline-none"
        (click)="selectRange(30)"
      >
        ۳۰ روز اخیر
      </button>
    </div>
  </div>

  @if (loading()) {
    <div class="flex min-h-72 w-full flex-1 items-center justify-center">
      <i class="pi pi-spin pi-spinner text-2xl text-primary" aria-label="بارگذاری"></i>
    </div>
  } @else if (!hasData()) {
    <div
      class="flex min-h-72 w-full flex-1 items-center justify-center text-sm text-gray-500 dark:text-gray-400"
    >
      داده‌ای نیست
    </div>
  } @else {
    <!--
      The wrapper is the element Chart.js measures. It must have a height the
      browser can resolve, which `flex-1` + `min-h-72` provides; `maintainAspectRatio: false`
      then makes the canvas fill it exactly.
    -->
    <div class="relative min-h-72 w-full flex-1">
      <p-chart
        type="bar"
        [data]="chartData()"
        [options]="chartOptions()"
        class="block h-full w-full"
      />
    </div>
  }
</div>

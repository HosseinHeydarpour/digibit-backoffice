<!-- src/app/features/dashboard/dashboard.html -->
<!--
  The dashboard body — three states, in the order the user meets them.

  The KPI grid is the reference's own, one-for-one:
  `arino/page/fa/admin-panel-index.html`, line 477
    <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-6 mb-6">

  ONE DELIBERATE DIFFERENCE FROM THE REFERENCE'S GRID (tc 6): the second
  breakpoint is 360px, not Tailwind's `sm` (640px). BO-E02 tc 6 asks for TWO
  columns on a phone, and a phone is 360-430px — `sm:grid-cols-2` would leave
  every one of them single-column. The base `grid-cols-1` still covers the
  320px case, which is the width the BO-B17 responsive review measured as the
  overflow floor. `min-[360px]` is the narrowest breakpoint that satisfies both.

  That means the skeleton in `loading-block`'s `cards` variant has to declare the
  same progression, or the placeholder and the content reflow into different
  shapes — see the note there.
-->
<app-page-header
  title="پیشخوان"
  [description]="'خلاصهٔ فروش، سفارش‌ها و موجودی فروشگاه — امروز ' + (today | persianDate: 'long')"
/>

<!--
  STATE 2 — A RE-RESOLVE IN FLIGHT (E01 tc 10).

  `loading-block`'s `cards` variant mirrors this grid exactly (same 1 / 360:2 /
  xl:4 progression, same gap-6), which is the whole point: the skeleton and the
  content occupy the same columns, so nothing reflows when the data lands.

  Only reachable on a retry or a return visit — see the component's comment on
  why first paint never shows this.
-->
@if (resolving()) {
  <app-loading-block [loading]="true" variant="cards" [rows]="1" [columns]="4" />
} @else if (summary(); as summary) {
  <!-- STATE 1 — DATA. Four tiles, each a link (tc 10). -->
  <!--
    Every cell in a row is the same height by definition of a grid; the CARD
    inside the cell had to be told to take it (`h-full` in `stat-card.html`),
    or «کاربران» — the one tile with no footer — ended a line higher than the
    three beside it.
  -->
  <div
    class="grid grid-cols-1 gap-6 min-[360px]:grid-cols-2 xl:grid-cols-4 print:grid-cols-2 print:gap-4"
  >
    <!--
      1 — SALES (tc 2, tc 4)

      The only KPI the summary carries a CHANGE for, and therefore the only tile
      with a trend pill: `trend` picks the arrow and the green/red tint,
      `trendPercent` is the pill's text, `footerText` is the sentence beside it.
      All three come from `salesTrend()` so the sign, the colour and the wording
      cannot disagree.

      The unit is a separate `StatCard` input because the reference prints it
      smaller beside the number — `[value]="… | toman: { unit: false }"` plus
      `[unit]="tomanUnit"` is that layout. `tomanUnit` is `TOMAN_UNIT` from the
      `toman` pipe, so the word is spelled once in the whole app (BO-E06 tc 4).
    -->
    <app-stat-card
      [value]="summary.totalSales | toman: { unit: false }"
      [unit]="tomanUnit"
      label="فروش امروز"
      icon="pi pi-dollar"
      tone="neutral"
      [actionable]="true"
      [footerText]="salesTrend()?.sentence"
      [trend]="salesTrend()?.direction ?? 'neutral'"
      [trendPercent]="salesTrend()?.percent"
      (cardClick)="open('/orders')"
    />

    <!--
      2 — NEW ORDERS

      The value is the ACTIONABLE subset (awaiting action); the footer states the
      total, so the tile reads "23 of 342" rather than repeating itself.
      `warning` — the reference colours its orders card amber.
    -->
    <app-stat-card
      [value]="summary.pendingOrders | persianDigits"
      unit="سفارش"
      label="سفارش‌های جدید"
      icon="pi pi-shopping-bag"
      tone="warning"
      [actionable]="true"
      [footerText]="'از ' + (summary.orderCount | persianDigits) + ' سفارش ثبت‌شده'"
      (cardClick)="open('/orders')"
    />

    <!--
      3 — CUSTOMERS

      No footer, and that is not an oversight: the summary carries no second
      customer number, and repeating the value in a muted sentence would be
      noise. `StatCard` hides the footer strip when it has nothing to show
      (`empty:hidden`), so the tile stays a plain card.
    -->
    <app-stat-card
      [value]="summary.customerCount | persianDigits"
      unit="کاربر"
      label="کاربران"
      icon="pi pi-users"
      tone="positive"
      [actionable]="true"
      (cardClick)="open('/customers')"
    />

    <!--
      4 — LOW STOCK (tc 5, tc 10)

      The tone is DERIVED, not fixed: red while products are actually running
      out, neutral when the shop is healthy. A permanently red card stops being
      read as a warning. The footer says "7 of 96" so the count has a scale.
    -->
    <app-stat-card
      [value]="summary.lowStockCount | persianDigits"
      unit="محصول"
      label="کم‌موجودی"
      icon="pi pi-box"
      [tone]="lowStockTone()"
      [actionable]="true"
      [footerText]="'از ' + (summary.productCount | persianDigits) + ' محصول'"
      (cardClick)="open('/products')"
    />
  </div>

  <div class="mt-6">
    <app-recent-orders
      [orders]="recentOrders()"
      [loading]="resolving()"
      [error]="recentOrdersError()"
      (orderClick)="onOrderClick($event)"
      (retry)="retryRecentOrders()"
    />
  </div>

  <div class="mt-6 grid grid-cols-1 gap-6 xl:grid-cols-3 print:mt-4 print:grid-cols-1 print:gap-4">
    <!--
      `block h-full` on both widget hosts, not a wrapper: a custom element is
      `display: inline` until told otherwise, and an inline box ignores the
      grid's stretch — which is why the chart card and the stock card used to
      end at two different heights. The wrapper divs are the grid items and are
      already stretched; the hosts only have to pass that height down.
    -->
    <div class="xl:col-span-2">
      <app-sales-chart
        class="block h-full"
        [data]="salesChartData()"
        [range]="chartRange()"
        [loading]="chartLoading()"
        [error]="salesChartError()"
        (rangeChange)="onChartRangeChange($event)"
        (retry)="retrySalesChart()"
      />
    </div>
    <div class="xl:col-span-1">
      <!--
        No `[threshold]` binding on purpose. The widget's own default IS
        `LOW_STOCK_THRESHOLD` — the same constant this page sends as
        `?threshold=` — so binding it would only be a second copy of one number
        travelling through a third place (and a class field read from a template
        is exactly the kind of wiring that breaks silently: an `undefined`
        threshold makes `stock <= undefined` false for every row, and the card
        renders «موجودی سالم» over a full list of low-stock products).
      -->
      <app-low-stock
        class="block h-full"
        [items]="lowStockItems()"
        [loading]="resolving()"
        [error]="lowStockError()"
        (editClick)="onEditProduct($event)"
        (retry)="retryLowStock()"
      />
    </div>
  </div>
} @else {
  <!--
    STATE 3 — THE RESOLVE FAILED (E01 tc 3).

    NOT `app-empty-state`: that component's contract is «موردی برای نمایش وجود
    ندارد» — an empty list, which is a normal outcome. A failed fetch is not
    normal, and reusing the empty state would tell the user the dashboard has
    no sales when what actually happened is that the request failed.

    `app-error-state` is the SAME red block the widgets draw for their own
    failures (BO-E07 tc 8): one failure, one look, everywhere — page or widget.
  -->
  <app-error-state
    [description]="'خلاصهٔ پیشخوان از سرور گرفته نشد. لطفاً دوباره تلاش کنید.'"
    (retry)="retry()"
  />
}

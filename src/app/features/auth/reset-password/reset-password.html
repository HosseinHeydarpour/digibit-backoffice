<div
  class="flex min-h-screen items-center justify-center bg-light px-4 py-10 dark:bg-background-dark"
>
  <div
    class="w-full max-w-md rounded-2xl border border-gray-200 bg-white p-6 shadow-xl dark:border-gray-700 dark:bg-gray-800 sm:p-8"
  >
    <div class="mb-6 text-center">
      <div
        class="mx-auto mb-3 flex h-12 w-12 items-center justify-center rounded-xl bg-primary/10 text-primary"
        aria-hidden="true"
      >
        <i class="pi pi-lock text-xl"></i>
      </div>
      <h1 class="text-lg font-bold text-gray-900 dark:text-white">تعیین رمز جدید</h1>
      <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
        کد بازیابی از ایمیل و رمز جدید را وارد کنید.
      </p>
    </div>

    @if (error(); as message) {
      <p
        role="alert"
        class="mb-4 rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700 dark:border-red-900/40 dark:bg-red-900/20 dark:text-red-300"
      >
        {{ message }}
      </p>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
      <app-form-field controlName="email" label="ایمیل" inputId="reset-email">
        <input
          pInputText
          id="reset-email"
          type="email"
          formControlName="email"
          dir="ltr"
          class="w-full text-left"
          autocomplete="username"
        />
      </app-form-field>

      <app-form-field controlName="token" label="کد بازیابی" inputId="reset-token">
        <input
          pInputText
          id="reset-token"
          formControlName="token"
          dir="ltr"
          class="w-full text-left font-mono"
        />
      </app-form-field>

      <app-form-field
        controlName="newPassword"
        label="رمز جدید"
        inputId="reset-new-password"
        hint="حداقل ۱۲ کاراکتر"
      >
        <input
          pInputText
          id="reset-new-password"
          type="password"
          formControlName="newPassword"
          autocomplete="new-password"
          dir="ltr"
          class="w-full text-left"
        />
      </app-form-field>

      <app-form-field
        controlName="confirmPassword"
        label="تکرار رمز جدید"
        inputId="reset-confirm-password"
        [error]="mismatch() ? 'تکرار رمز با رمز جدید یکسان نیست.' : null"
      >
        <input
          pInputText
          id="reset-confirm-password"
          type="password"
          formControlName="confirmPassword"
          autocomplete="new-password"
          dir="ltr"
          class="w-full text-left"
        />
      </app-form-field>

      <button pButton pLoading type="submit" [loading]="submitting()" class="w-full">
        تغییر رمز
      </button>
    </form>

    <a routerLink="/login" class="mt-4 inline-block text-sm text-primary hover:underline">
      بازگشت به ورود
    </a>
  </div>
</div>

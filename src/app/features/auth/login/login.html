<div
  class="flex min-h-screen items-center justify-center bg-light px-4 py-10 dark:bg-background-dark"
>
  <form
    [formGroup]="form"
    (ngSubmit)="submit()"
    class="w-full max-w-md rounded-2xl border border-gray-200 bg-white p-6 shadow-xl dark:border-gray-700 dark:bg-gray-800 sm:p-8"
  >
    <div class="mb-6 text-center">
      <div
        class="mx-auto mb-3 flex h-12 w-12 items-center justify-center rounded-xl bg-primary/10 text-primary"
        aria-hidden="true"
      >
        <i class="pi pi-lock text-xl"></i>
      </div>
      <h1 class="text-lg font-bold text-gray-900 dark:text-white">{{ appName }}</h1>
      <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">ورود به پنل مدیریت</p>
    </div>

    @if (error(); as message) {
      <p
        role="alert"
        class="mb-4 rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700 dark:border-red-900/40 dark:bg-red-900/20 dark:text-red-300"
      >
        {{ message }}
      </p>
    }

    <div class="space-y-4">
      <app-form-field controlName="email" label="ایمیل" inputId="login-email">
        <input
          pInputText
          id="login-email"
          type="email"
          formControlName="email"
          dir="ltr"
          class="w-full text-left"
          autocomplete="username"
          inputmode="email"
        />
      </app-form-field>

      <app-form-field controlName="password" label="رمز عبور" inputId="login-password">
        <input
          pInputText
          id="login-password"
          type="password"
          formControlName="password"
          dir="ltr"
          class="w-full text-left"
          autocomplete="current-password"
        />
      </app-form-field>
    </div>

    <button pButton pLoading type="submit" [loading]="submitting()" class="mt-6 w-full">
      ورود
    </button>
  </form>
</div>

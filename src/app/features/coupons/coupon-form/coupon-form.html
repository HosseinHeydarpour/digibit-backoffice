<form [formGroup]="form" (ngSubmit)="save()" class="space-y-4">
  <app-form-field
    controlName="code"
    label="کد کوپن"
    inputId="coupon-code"
    hint="حروف انگلیسی، رقم و خط تیره؛ ۳ تا ۲۰ کاراکتر"
    [error]="fieldError('code')"
  >
    <div class="flex gap-2">
      <input
        pInputText
        id="coupon-code"
        formControlName="code"
        dir="ltr"
        class="w-full font-mono uppercase"
        placeholder="OFF-XXXXXX"
      />
      <button
        type="button"
        (click)="generateCode()"
        [disabled]="saving()"
        class="inline-flex min-h-10 shrink-0 items-center gap-1 rounded-lg border border-gray-300 px-3 text-sm font-medium text-gray-700 transition hover:bg-gray-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary disabled:cursor-not-allowed disabled:opacity-50 dark:border-gray-600 dark:text-gray-300 dark:hover:bg-gray-700"
      >
        <i class="pi pi-refresh text-xs" aria-hidden="true"></i>
        تولید
      </button>
    </div>
  </app-form-field>

  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
    <app-form-field controlName="type" label="نوع کوپن" inputId="coupon-type">
      <p-select
        inputId="coupon-type"
        formControlName="type"
        [options]="typeOptions"
        optionLabel="label"
        optionValue="value"
        appendTo="body"
        class="w-full"
        styleClass="w-full"
      />
    </app-form-field>

    <app-form-field
      controlName="value"
      label="مقدار"
      inputId="coupon-value"
      [hint]="form.controls.type.value === 'percent' ? 'بین ۱ و ۱۰۰' : 'به تومان'"
      [error]="fieldError('value')"
    >
      <p-inputnumber
        inputId="coupon-value"
        formControlName="value"
        mode="decimal"
        [min]="0"
        [useGrouping]="false"
        [suffix]="form.controls.type.value === 'percent' ? '٪' : ' تومان'"
        class="w-full"
        styleClass="w-full"
      />
    </app-form-field>
  </div>

  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
    <app-form-field
      controlName="from"
      label="شروع اعتبار"
      inputId="coupon-from"
      [control]="form.controls.from"
      [error]="fieldError('from')"
    >
      <app-jalali-datepicker [control]="form.controls.from" inputId="coupon-from" />
    </app-form-field>

    <app-form-field
      controlName="to"
      label="پایان اعتبار"
      inputId="coupon-to"
      [control]="form.controls.to"
      [error]="fieldError('to')"
    >
      <app-jalali-datepicker [control]="form.controls.to" inputId="coupon-to" />
    </app-form-field>
  </div>

  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
    <app-form-field
      controlName="maxUses"
      label="سقف استفادهٔ کل"
      inputId="coupon-max-uses"
      hint="بزرگ‌تر از صفر"
      [error]="fieldError('maxUses')"
    >
      <p-inputnumber
        inputId="coupon-max-uses"
        formControlName="maxUses"
        mode="decimal"
        [min]="1"
        [useGrouping]="false"
        class="w-full"
        styleClass="w-full"
      />
    </app-form-field>

    <app-form-field
      controlName="maxUsesPerUser"
      label="سقف هر کاربر"
      inputId="coupon-max-per-user"
      hint="خالی بگذارید تا محدودیتی نباشد"
      [error]="fieldError('maxUsesPerUser')"
    >
      <p-inputnumber
        inputId="coupon-max-per-user"
        formControlName="maxUsesPerUser"
        mode="decimal"
        [min]="1"
        [useGrouping]="false"
        [showClear]="true"
        class="w-full"
        styleClass="w-full"
      />
    </app-form-field>
  </div>

  <app-form-field
    controlName="minCart"
    label="حداقل سبد"
    inputId="coupon-min-cart"
    hint="به تومان؛ صفر یعنی بدون شرط"
    [error]="fieldError('minCart')"
  >
    <p-inputnumber
      inputId="coupon-min-cart"
      formControlName="minCart"
      mode="decimal"
      [min]="0"
      [useGrouping]="false"
      suffix=" تومان"
      class="w-full"
      styleClass="w-full"
    />
  </app-form-field>

  @if (minCartWarning(); as warning) {
    <p class="text-xs text-yellow-700 dark:text-yellow-400">
      <i class="pi pi-exclamation-circle text-xs" aria-hidden="true"></i>
      {{ warning }}
    </p>
  }

  <app-form-field controlName="description" label="توضیحات" inputId="coupon-description">
    <textarea
      id="coupon-description"
      rows="3"
      pTextarea
      formControlName="description"
      placeholder="این کد برای چه کمپینی است؟ (اختیاری)"
      class="w-full"
    ></textarea>
  </app-form-field>

  @if (saveError(); as message) {
    <p
      role="alert"
      class="rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700 dark:border-red-900/40 dark:bg-red-900/20 dark:text-red-300"
    >
      {{ message }}
    </p>
  }

  <div
    class="flex flex-col-reverse gap-2 border-t border-gray-100 pt-4 sm:flex-row sm:justify-end dark:border-gray-700"
  >
    <button
      type="button"
      (click)="cancelled.emit()"
      [disabled]="saving()"
      class="inline-flex min-h-10 items-center justify-center rounded-lg border border-gray-300 px-4 text-sm font-medium text-gray-700 transition hover:bg-gray-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary disabled:cursor-not-allowed disabled:opacity-50 dark:border-gray-600 dark:text-gray-300 dark:hover:bg-gray-700"
    >
      انصراف
    </button>
    <button
      pButton
      type="submit"
      pLoading
      [loading]="saving()"
      class="inline-flex min-h-10 items-center justify-center"
    >
      ذخیره
    </button>
  </div>
</form>
